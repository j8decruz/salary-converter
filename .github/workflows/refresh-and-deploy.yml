name: Refresh data and deploy

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (10:17 Bangkok)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the data pipeline
        run: npm test

      # If an API is down or a check fails, keep the last good data.json and still deploy.
      - name: Refresh data from World Bank, IMF and currency-api
        id: data
        continue-on-error: true
        run: npm run build:data

      - name: Commit refreshed data
        if: steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || { git commit -m "Refresh data $(date -u +%F)" && git push; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
